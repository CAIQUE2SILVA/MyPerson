name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'admin/**'
      - 'nginx/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: myperson/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: myperson/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false
          tags: myperson/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
