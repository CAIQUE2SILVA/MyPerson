<div class="dashboard-container">
  <div class="dashboard-header">
    <h1 class="dashboard-title">Resumo da Gestão</h1>
    <span class="last-update">Última atualização: Hoje, {{ ultimaAtualizacao | date:'HH:mm' }}</span>
  </div>

  @if (carregando()) {
  <div class="loading-wrapper">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Carregando resumo...</span>
  </div>
  }

  @if (erro(); as mensagem) {
  <div class="error-message">{{ mensagem }}</div>
  }

  <div class="kpi-cards">
    @for (card of cards; track card.titulo) {
    <mat-card class="kpi-card kpi-card-{{ card.cor }}" [routerLink]="card.rota">
      <div class="kpi-icon-wrapper">
        <mat-icon>{{ card.icone }}</mat-icon>
      </div>
      <div class="kpi-content">
        <span class="kpi-label">{{ card.titulo }}</span>
        <span class="kpi-value">{{ card.valor() }}</span>
      </div>
    </mat-card>
    }
  </div>
</div>
