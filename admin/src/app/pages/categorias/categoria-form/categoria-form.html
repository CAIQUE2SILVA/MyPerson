<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">{{ titulo }}</h1>
    <a mat-button routerLink="/categorias">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </a>
  </div>

  <mat-card>
    <form [formGroup]="form" (ngSubmit)="salvar()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" maxlength="100" />
        @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
        <mat-error>Nome é obrigatório.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Slug</mat-label>
        <input matInput formControlName="slug" maxlength="100" />
        @if (form.get('slug')?.invalid && form.get('slug')?.touched) {
        <mat-error>Slug é obrigatório.</mat-error>
        }
      </mat-form-field>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="carregando()">
          @if (carregando()) {
          <mat-spinner diameter="18" class="inline-spinner"></mat-spinner>
          }
          Salvar
        </button>
        <a mat-button routerLink="/categorias">Cancelar</a>
      </div>
    </form>
  </mat-card>
</div>
