<div class="page-container">
  <div class="page-header">
    <div class="page-heading">
      <span class="app-eyebrow">Organização</span>
      <h1 class="page-title">{{ titulo }}</h1>
    </div>
    <a mat-stroked-button routerLink="/categorias">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </a>
  </div>

  <div class="app-form-section">
    <div class="app-form-section__header">
      <h2 class="app-form-section__title">Dados da categoria</h2>
    </div>
    <div class="app-form-section__body">
      <form [formGroup]="form" (ngSubmit)="salvar()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" maxlength="100" />
          @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
          <mat-error>Nome é obrigatório.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Slug</mat-label>
          <input matInput formControlName="slug" maxlength="100" class="app-mono" />
          @if (form.get('slug')?.invalid && form.get('slug')?.touched) {
          <mat-error>Slug é obrigatório.</mat-error>
          }
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="carregando()">
            @if (carregando()) {
            <mat-spinner diameter="18" class="inline-spinner"></mat-spinner>
            }
            Salvar
          </button>
          <a mat-stroked-button routerLink="/categorias">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
