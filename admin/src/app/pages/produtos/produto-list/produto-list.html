<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Produtos</h1>
    <a mat-flat-button color="primary" routerLink="/produtos/novo">
      <mat-icon>add</mat-icon>
      Novo produto
    </a>
  </div>

  @if (carregando()) {
  <div class="loading-wrapper">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Carregando produtos...</span>
  </div>
  }

  <mat-card>
    <table mat-table [dataSource]="produtos()" class="data-table">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>NOME</th>
        <td mat-cell *matCellDef="let produto">{{ produto.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="preco">
        <th mat-header-cell *matHeaderCellDef>PREÇO</th>
        <td mat-cell *matCellDef="let produto">{{ formatarMoeda(produto.preco) }}</td>
      </ng-container>

      <ng-container matColumnDef="estoque">
        <th mat-header-cell *matHeaderCellDef>ESTOQUE</th>
        <td mat-cell *matCellDef="let produto">{{ produto.estoque }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>CATEGORIA</th>
        <td mat-cell *matCellDef="let produto">{{ produto.categoriaNome || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef>ATIVO</th>
        <td mat-cell *matCellDef="let produto">{{ produto.ativo ? 'Sim' : 'Não' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>AÇÕES</th>
        <td mat-cell *matCellDef="let produto">
          <a mat-icon-button [routerLink]="['/produtos', produto.id, 'editar']" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="excluir(produto)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
  </mat-card>
</div>
