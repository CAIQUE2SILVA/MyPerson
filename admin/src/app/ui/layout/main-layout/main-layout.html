<app-toolbar [opened]="opened()" (menuClick)="toggleSidenav()"></app-toolbar>
<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [opened]="opened()" [mode]="mode()">
    <div class="sidenav-header">
      <h2>MyPerson</h2>
    </div>
    <p-menu [model]="menuItems" styleClass="app-sidebar-menu"></p-menu>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
